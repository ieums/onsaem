name: Deploy to EC2

on:
  push:
    branches: [ develop, feature/fe-video-lesson, feature/be-matching ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 코드 체크아웃
      uses: actions/checkout@v3

    - name: JDK 17 설정
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Flutter 설정
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.9'

    - name: Gradle 빌드
      run: |
        cd backend
        chmod +x gradlew
        ./gradlew build -x test

    - name: Flutter 웹 빌드
      run: |
        cd frontend
        flutter pub get
        flutter build web --release --dart-define=PRODUCTION=true

    - name: EC2에 백엔드 jar 전송
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_KEY }}
        source: "backend/build/libs/backend-0.0.1-SNAPSHOT.jar"
        target: "/home/ubuntu/"
        strip_components: 3

    - name: EC2에 Flutter 웹 전송
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_KEY }}
        source: "frontend/build/web/*"
        target: "/var/www/onsaem/"
        strip_components: 3

    - name: EC2에서 서버 재시작
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          sudo kill $(sudo lsof -t -i:8080) || true
          export DB_URL="${{ secrets.DB_URL }}"
          export DB_USERNAME="${{ secrets.DB_USERNAME }}"
          export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AGORA_APP_ID="${{ secrets.AGORA_APP_ID }}"
          export AGORA_APP_CERTIFICATE="${{ secrets.AGORA_APP_CERTIFICATE }}"
          export AGORA_CUSTOMER_ID="${{ secrets.AGORA_CUSTOMER_ID }}"
          export AGORA_CUSTOMER_SECRET="${{ secrets.AGORA_CUSTOMER_SECRET }}"
          export GEMINI_API_KEY="none"
          nohup java -jar /home/ubuntu/backend-0.0.1-SNAPSHOT.jar \
            --spring.profiles.active=prod > app.log 2>&1 &