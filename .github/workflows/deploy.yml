name: Deploy to EC2

on:
  push:
    branches: [ develop ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 코드 체크아웃
      uses: actions/checkout@v3

    - name: JDK 17 설정
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Gradle 빌드
      run: |
        cd backend
        chmod +x gradlew
        ./gradlew build -x test

    - name: EC2에 jar 전송
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_KEY }}
        source: "backend/build/libs/backend-0.0.1-SNAPSHOT.jar"
        target: "/home/ubuntu/"
        strip_components: 3

    - name: EC2에서 서버 재시작
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          sudo kill $(sudo lsof -t -i:8080) || true
          nohup java -jar /home/ubuntu/backend-0.0.1-SNAPSHOT.jar \
            --spring.datasource.url="${{ secrets.DB_URL }}" \
            --spring.datasource.username=${{ secrets.DB_USERNAME }} \
            --spring.datasource.password=${{ secrets.DB_PASSWORD }} \
            --cloud.aws.credentials.access-key=${{ secrets.AWS_ACCESS_KEY_ID }} \
            --cloud.aws.credentials.secret-key=${{ secrets.AWS_SECRET_ACCESS_KEY }} > app.log 2>&1 &
