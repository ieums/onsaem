spring:
  application:
    name: ieum-backend
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
server:
  port: 8080
file:
  upload-dir: uploads
gemini:
  api:
    key: ${GEMINI_API_KEY:none}

cloud:
  aws:
    region:
      static: ap-northeast-2
    s3:
      bucket: onsaem-bucket
