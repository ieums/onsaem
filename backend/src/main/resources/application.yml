spring:
  application:
    name: ieum-backend

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

file:
  upload-dir: uploads

gemini:
  api:
    key: ${GEMINI_API_KEY:none}