spring:
  application:
    name: ieum-backend
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  cloud:
    aws:
      region:
        static: ap-northeast-2
      s3:
        bucket: onsaem-bucket
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8080

file:
  upload-dir: uploads

gemini:
  api:
    key: ${GEMINI_API_KEY:none}

agora:
  app-id: ${AGORA_APP_ID:none}
  app-certificate: ${AGORA_APP_CERTIFICATE:none}
  token-expiry-seconds: 3600
  customer-id: ${AGORA_CUSTOMER_ID:none}
  customer-secret: ${AGORA_CUSTOMER_SECRET:none}