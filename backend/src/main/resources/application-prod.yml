spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update

  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}

portone:
  api-secret: ${PORTONE_API_SECRET:}
  api-base-url: https://api.portone.io
  verification-enabled: ${PORTONE_VERIFY:false}

# 녹화 사용(prod) — S3 자격증명이 있을 때만 켤 것. 로컬은 기본 false.
agora:
  recording:
    enabled: ${AGORA_RECORDING_ENABLED:true}

jwt:
  secret: ${JWT_SECRET}