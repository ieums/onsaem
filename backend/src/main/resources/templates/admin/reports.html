<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>온샘 관리자 · 신고</title>
    <link rel="stylesheet" th:href="@{/admin/admin.css}">
</head>
<body>
<div th:replace="~{admin/_layout :: shell('reports')}"></div>

<div class="container">
    <div class="page-head">
        <h1>신고 관리</h1>
    </div>

    <div class="flash" th:if="${msg}" th:text="${msg}"></div>

    <div class="filters">
        <a class="chip" th:classappend="${status == null} ? 'active'" th:href="@{/admin/reports}">전체</a>
        <a th:each="st : ${statuses}" class="chip"
           th:classappend="${status != null and status.name() == st.name()} ? 'active'"
           th:href="@{/admin/reports(status=${st})}"
           th:text="${st.displayName}">상태</a>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>상태</th>
                <th>신고자</th>
                <th>대상</th>
                <th>강의</th>
                <th>접수일</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${rows}">
                <td><span class="badge" th:classappend="${r.status()}" th:text="${r.status().displayName}">상태</span></td>
                <td th:text="${r.reporterType()} + (${r.reporterName() != null and !r.reporterName().isBlank()} ? ' ' + ${r.reporterName()} : '')">학생 홍길동</td>
                <td th:text="${r.targetType()} + (${r.targetName() != null and !r.targetName().isBlank()} ? ' ' + ${r.targetName()} : '')">강사 김철수</td>
                <td class="faint" th:text="${r.lessonId() != null ? '연결됨' : '-'}">-</td>
                <td class="faint" th:text="${#temporals.format(r.createdAt(), 'yyyy-MM-dd HH:mm')}">2026-06-30</td>
                <td><a class="btn ghost" th:href="@{/admin/reports/{id}(id=${r.id()})}">상세</a></td>
            </tr>
            <tr th:if="${rows.isEmpty()}">
                <td colspan="6" class="faint" style="text-align:center;padding:32px;">신고가 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:replace="~{admin/_layout :: pager('/admin/reports', null, ${status != null ? status.name() : null})}"></div>
</div>
</body>
</html>
