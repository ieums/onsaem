<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>온샘 관리자 · 대시보드</title>
    <link rel="stylesheet" th:href="@{/admin/admin.css}">
</head>
<body>
<div th:replace="~{admin/_layout :: shell('dashboard')}"></div>

<div class="container">
    <div class="page-head">
        <h1>대시보드</h1>
    </div>

    <!-- 핵심 지표 (컴팩트 한 줄) -->
    <div class="kpi-row">
        <a class="kpi" th:href="@{/admin/students}">
            <span class="k-label">학생</span>
            <span class="k-value" th:text="${studentCount}">0</span>
        </a>
        <a class="kpi" th:href="@{/admin/tutors}">
            <span class="k-label">강사</span>
            <span class="k-value" th:text="${tutorCount}">0</span>
        </a>
        <a class="kpi" th:href="@{/admin/lessons}">
            <span class="k-label">진행중 강의</span>
            <span class="k-value" th:text="${lessonActive}">0</span>
        </a>
        <a class="kpi" th:href="@{/admin/lessons}">
            <span class="k-label">완료 강의</span>
            <span class="k-value" th:text="${lessonCompleted}">0</span>
        </a>
        <div class="kpi">
            <span class="k-label">평균 강의시간</span>
            <span class="k-value" th:text="${avgLessonMinutes != null ? avgLessonMinutes + '분' : '-'}">-</span>
        </div>
        <a class="kpi" th:href="@{/admin/payments}">
            <span class="k-label">매출 (완료)</span>
            <span class="k-value" th:text="'₩' + ${#numbers.formatInteger(paymentRevenue, 0, 'COMMA')}">₩0</span>
        </a>
    </div>

    <!-- 강의 상태 분포 (순수 CSS 막대그래프) -->
    <div class="card" style="margin-top:18px;">
        <div class="card-head"><span>강의 상태 분포</span></div>
        <div class="bar-chart">
            <div class="bar-row" th:each="b : ${lessonChart}">
                <span class="bar-label" th:text="${b.label()}">상태</span>
                <div class="bar-track">
                    <div class="bar-fill" th:classappend="${b.statusClass()}"
                         th:style="'width:' + ${b.count() * 100 / lessonChartMax} + '%'"></div>
                </div>
                <span class="bar-value" th:text="${b.count()}">0</span>
            </div>
        </div>
    </div>

    <!-- 처리 필요(신고) + 정산 요약 : 2열 -->
    <div class="dash-2">
        <div class="card">
            <div class="card-head">
                <span>처리 필요 · 신고</span>
                <a class="more" th:href="@{/admin/reports}">전체 →</a>
            </div>
            <a class="todo" th:href="@{/admin/reports(status='PENDING')}">
                <span>접수 대기</span>
                <b th:classappend="${reportPending > 0} ? ' hot' : ' zero'" th:text="${reportPending}">0</b>
            </a>
            <a class="todo" th:href="@{/admin/reports(status='REVIEWING')}">
                <span>검토중</span>
                <b th:classappend="${reportReviewing == 0} ? ' zero' : ''" th:text="${reportReviewing}">0</b>
            </a>
            <div class="todo-foot">
                처리완료 <b th:text="${reportResolved}">0</b> · 반려 <b th:text="${reportRejected}">0</b>
            </div>
        </div>

        <div class="card">
            <div class="card-head">
                <span>정산 / 송금</span>
                <a class="more" th:href="@{/admin/settlements}">전체 →</a>
            </div>
            <table class="mini-table">
                <tr th:each="row : ${settlementStats}">
                    <td>
                        <a th:href="@{/admin/settlements(status=${row.status()})}">
                            <span class="badge" th:classappend="${row.status()}" th:text="${row.displayName()}">상태</span>
                        </a>
                    </td>
                    <td class="num" th:text="${row.count()} + '건'">0건</td>
                    <td class="num" th:text="${#numbers.formatInteger(row.amount(), 0, 'COMMA')} + '원'">0원</td>
                </tr>
                <tr th:if="${settlementStats == null or settlementStats.isEmpty()}">
                    <td class="faint" colspan="3">정산 내역이 없습니다.</td>
                </tr>
            </table>
        </div>
    </div>

    <!-- Gemini 사용량 (근사) : 작은 인라인 스트립 -->
    <div class="mini-strip">
        <span class="ms-title">Gemini 사용량 (근사)</span>
        <span class="ms-item">OCR <b th:text="${geminiOcrApprox}">0</b></span>
        <span class="ms-item">챗 <b th:text="${geminiChatApprox}">0</b></span>
        <span class="ms-item">요약 <b th:text="${geminiSummaryApprox}">0</b></span>
    </div>
</div>
</body>
</html>
