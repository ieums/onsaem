<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>온샘 관리자 · 정산</title>
    <link rel="stylesheet" th:href="@{/admin/admin.css}">
</head>
<body>
<div th:replace="~{admin/_layout :: shell('settlements')}"></div>

<div class="container">
    <div class="page-head">
        <h1>정산 / 송금 관리</h1>
    </div>

    <div class="flash" th:if="${msg}" th:text="${msg}"></div>

    <!-- 상태별 요약 (건수 × 합계). 송금대기(PENDING) 강조. -->
    <div class="card" style="margin-bottom:18px;">
        <div class="card-head"><span>정산 상태 요약</span></div>
        <table class="mini-table">
            <tr th:each="row : ${settlementStats}"
                th:style="${row.status().name() == 'PENDING'} ? 'background:var(--brand-tint);' : ''">
                <td>
                    <a th:href="@{/admin/settlements(status=${row.status()})}">
                        <span class="badge" th:classappend="${row.status()}" th:text="${row.displayName()}">상태</span>
                    </a>
                    <span class="faint" th:if="${row.status().name() == 'PENDING'}" style="margin-left:6px;">← 송금 처리 필요</span>
                </td>
                <td class="num" th:text="${row.count()} + '건'">0건</td>
                <td class="num" th:text="${#numbers.formatInteger(row.amount(), 0, 'COMMA')} + '원'">0원</td>
            </tr>
        </table>
    </div>

    <div class="filters">
        <a class="chip" th:classappend="${status == null} ? 'active'" th:href="@{/admin/settlements}">전체</a>
        <a th:each="st : ${statuses}" class="chip"
           th:classappend="${status != null and status.name() == st.name()} ? 'active'"
           th:href="@{/admin/settlements(status=${st})}"
           th:text="${st.displayName}">상태</a>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>상태</th>
                <th>강사</th>
                <th>과목</th>
                <th class="num">정산금 (원)</th>
                <th>생성일</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${rows}">
                <td><span class="badge" th:classappend="${r.status()}" th:text="${r.status().displayName}">상태</span></td>
                <td th:text="${r.tutorName() != null ? r.tutorName() : '-'}">강사명</td>
                <td th:text="${r.subject() != null ? T(com.ieum.backend.domain.problem.entity.enums.Subject).displayNameOf(r.subject()) : '-'}">수학</td>
                <td class="num" th:text="${#numbers.formatInteger(r.tutorAmount(), 0, 'COMMA')}">0</td>
                <td class="faint" th:text="${#temporals.format(r.createdAt(), 'yyyy-MM-dd HH:mm')}">2026-06-30</td>
                <td><a class="btn ghost" th:href="@{/admin/settlements/{id}(id=${r.id()})}">상세</a></td>
            </tr>
            <tr th:if="${rows.isEmpty()}">
                <td colspan="6" class="faint" style="text-align:center;padding:32px;">정산 내역이 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:replace="~{admin/_layout :: pager('/admin/settlements', null, ${status != null ? status.name() : null})}"></div>
</div>
</body>
</html>
