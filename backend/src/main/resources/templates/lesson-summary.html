<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <style>
        @font-face {
            font-family: "NotoSansKR";
            src: url("fonts/NotoSansKR-VariableFont_wght.ttf");
        }
        body {
            font-family: "NotoSansKR", sans-serif;
            padding: 30px;
            line-height: 1.6;
            color: #222;
        }
        h1 {
            border-bottom: 3px solid #4a90e2;
            padding-bottom: 8px;
        }
        h2 {
            color: #4a90e2;
            margin-top: 30px;
            border-left: 4px solid #4a90e2;
            padding-left: 10px;
        }
        .meta {
            background: #f4f6f9;
            padding: 12px;
            border-radius: 6px;
            margin: 16px 0;
            font-size: 13px;
            color: #555;
        }
        .problem-image {
            margin: 16px 0;
            text-align: center;
        }
        .problem-image img {
            max-width: 90%;
            border: 1px solid #ddd;
        }
        .caption {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
        ul {
            padding-left: 20px;
        }
        li {
            margin: 4px 0;
        }
    </style>
</head>
<body>
<h1>온샘 · 강의 복습 자료</h1>
<div class="meta"><strong>강의 일시:</strong> {{startedAt}} ~ {{endedAt}}</div>
<h2>다룬 문제</h2>
{{images}}
{{summary}}
</body>
</html>
