<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <style>
        @font-face {
            font-family: "NotoSansKR";
            src: url("fonts/NotoSansKR-Regular.ttf");
        }
        body {
            font-family: "NotoSansKR", sans-serif;
            margin: 0;
            padding: 0;
            color: #2a2a2a;
            line-height: 1.6;
        }
        .header {
            background: #4C7A1E;
            padding: 22px 30px;
        }
        .header .title {
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
        }
        .header .subtitle {
            font-size: 12px;
            color: #E0FFB4;
            margin-top: 4px;
        }
        .content {
            padding: 24px 30px 30px;
        }
        .meta {
            background: #f6f8f3;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #555;
        }
        h2 {
            background: #E0FFB4;
            color: #3A5E16;
            font-size: 15px;
            padding: 7px 12px;
            border-radius: 6px;
            margin-top: 24px;
            margin-bottom: 10px;
        }
        p {
            font-size: 13px;
            line-height: 1.7;
            margin: 8px 2px;
        }
        ul {
            padding-left: 22px;
            margin: 8px 2px;
        }
        li {
            font-size: 13px;
            line-height: 1.7;
            margin: 5px 0;
        }
        .problem-image {
            margin: 14px 0;
            text-align: center;
        }
        .problem-image img {
            max-width: 90%;
            border: 1px solid #ddd;
            border-radius: 6px;
        }
        .caption {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
    </style>
</head>
<body>
<div class="header">
    <div class="title">온샘 · 강의 복습 자료</div>
</div>
<div class="content">
    <div class="meta"><strong>강의 일시:</strong> {{startedAt}} ~ {{endedAt}}</div>
    <h2>다룬 문제</h2>
    {{images}}
    {{summary}}
</div>
</body>
</html>
